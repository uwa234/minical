server {
    listen 80 default_server;
    # server_name  www.example.com example.com;
    root /app;

    # Allow cropped/logo uploads (default 1m causes HTTP 413 before PHP runs).
    client_max_body_size 10M;

    index index.php index.html index.htm;

    # Tell PHP when the original client request was HTTPS (TLS terminates upstream).
    set $fe_https "";
    if ($http_x_forwarded_proto = https) {
        set $fe_https "on";
    }

    # Root has no index file; send visitors to the app under /public/
    location = / {
        if ($http_x_forwarded_proto = 'https') {
            return 301 https://$host/public/;
        }
        return 301 /public/;
    }

    location ~* ^/public/(css|fonts|images|js)/ {}

    location ^~ /public/uploads/ {
        alias /app/public/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }
    location ~* ^/.*/assets/.* {}

    location / {
        rewrite ^/api/(.*)$ /api/index.php?/$1 last;
        rewrite ^/public/(.*)$ /public/index.php?/$1 last;
        try_files $uri $uri/ @redirect_to_public;
    }

    location @redirect_to_public {
        if ($http_x_forwarded_proto = 'https') {
            return 301 https://$host/public$request_uri;
        }
        return 301 /public$request_uri;
    }

    location ~ \.php$ {
        # root html;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        # App sits behind TLS termination — tell PHP the original scheme.
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTPS $fe_https if_not_empty;
        # increase default buffers and timeouts
        fastcgi_buffers 8 16k;       # default is 8 4k|8k
        fastcgi_buffer_size 32k;     # default is 4k|8k
        fastcgi_connect_timeout 60s; # default is 60s
        fastcgi_send_timeout 300s;   # default is 60s
        fastcgi_read_timeout 300s;   # default is 60s
    }

    location ~* ^/(assets|files|robots\.txt) { }

    location ~ /\.ht {
        deny  all;
    }

#     error_page   404              /404.html;
#     # redirect server error pages to the static page /50x.html
#     #
#     error_page   500 502 503 504  /50x.html;
#     location = /50x.html {
#         root   /usr/share/nginx/html;
#     }

}
