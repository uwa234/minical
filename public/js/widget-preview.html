<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>miniCal booking widget preview</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            margin: 2rem;
            background: #f5f5f5;
        }
        h1 { font-size: 1.25rem; font-weight: 600; }
        p { color: #555; max-width: 40rem; }
        .preview-box {
            margin-top: 1.5rem;
            padding: 2rem;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <h1>Booking widget preview</h1>
    <p>Embedded widget (company ID 1). Submit opens online reservation in a new tab.</p>
    <div class="preview-box">
        <div class="minical-booking-widget" name="1" style="width:250px;"></div>
    </div>
    <script>
        window.miniCal = window.miniCal || {};
        window.miniCal.companyId = '1';
        window.miniCal.projectUrl = 'http://localhost:8080/public/';
    </script>
    <script src="widget.js?v=2.0" type="text/javascript"></script>
</body>
</html>
